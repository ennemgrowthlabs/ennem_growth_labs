services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: ennem_growth_labs
      MYSQL_USER: ennem
      MYSQL_PASSWORD: ennemsecret
    ports:
      - "3306:3306"
    volumes:
      - ennem_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ennem:ennemsecret@mysql:3306/ennem_growth_labs
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP: https://wa.me/916383840619
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["full"]
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ennem_mysql:
